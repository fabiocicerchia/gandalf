[default]
# release-please writes CHANGELOG entries as markdown links whose label is the
# abbreviated commit SHA — "([ba2dccd](https://github.com/...))". typos reads
# those hex strings as words ("ba" -> "by"/"be"). Ignore SHA-shaped link labels
# rather than skipping CHANGELOG.md, so its prose is still checked.
extend-ignore-re = [
  "\\[[0-9a-f]{7,40}\\]",
  # `(ba)?sh` in the doctor test's regex: the alternation for bash/sh, not
  # a misspelt "by"/"be". Ignore the fragment, not the file.
  "\\(ba\\)\\?sh",
]

[default.extend-words]
# `noet` is `noexpandtab` in the Vim help modeline, not a misspelling of "note".
noet = "noet"
# `colr` is the stand-in misspelling in the codespell-suggestion tests — the
# fixture *is* a typo, and correcting it would delete what the test checks.
colr = "colr"
