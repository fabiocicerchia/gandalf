site_name: Gandalf
site_description: Codebase quality-gate evaluator with RAG traffic lights.
repo_url: https://github.com/fabiocicerchia/gandalf
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - CLI reference: cli.md
  - Configuration: configuration.md
  - Gate ruleset: gates.md
  - Getting Started: getting-started.md
  - Reports and badges: reports.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
