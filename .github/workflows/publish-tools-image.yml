name: publish-tools-image

# Build the gandalf-tools scanner image (tools.Dockerfile) and push it to the
# GitHub Container Registry, so the gandalf Action can `docker pull` it instead
# of building it on every run. Tools change rarely, so this runs only when
# tools.Dockerfile changes, on a release, or on demand.

on:
  push:
    branches: [main]
    paths: [tools.Dockerfile]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

concurrency:
  group: publish-tools-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest + a short-sha tag always; on a release, also the semver tags.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/gandalf-tools
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: tools.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
