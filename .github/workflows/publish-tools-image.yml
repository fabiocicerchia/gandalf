name: publish-tools-image

# Build the gandalf-tools scanner image (tools.Dockerfile) and push it to the
# GitHub Container Registry, so the gandalf Action can `docker pull` it instead
# of building it on every run. Tools change rarely, so this runs only when
# tools.Dockerfile changes, on a release, or on demand.

on:
  push:
    branches: [main]
    paths: [tools.Dockerfile, tools-requirements.txt]
  # A release published by release-please runs under GITHUB_TOKEN, and GitHub
  # deliberately does not fire workflows from GITHUB_TOKEN events — so this
  # trigger alone never ran on a release. release.yml now calls this workflow
  # directly via workflow_call; the release trigger stays for releases cut by a
  # human.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build.
        required: true
        type: string
    # Optional so the `release` and `workflow_dispatch` triggers above still
    # work: under those this workflow reads the repository secrets directly,
    # and only a workflow_call has to be handed them explicitly.
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub account the image is mirrored to.
        required: false
      DOCKERHUB_TOKEN:
        description: Access token for that Docker Hub account.
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.2.5). Empty builds the default branch.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-tools-image
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signing via OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Called from release.yml the run's ref is main, not the tag, so the
      # version comes from the input rather than from `github.ref`.
      - name: Resolve the release tag
        id: ver
        env:
          TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}
        run: echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      # latest + a short-sha tag always; on a release, also the semver tags.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/gandalf-tools
            docker.io/${{ github.repository_owner }}/gandalf-tools
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        id: build
        with:
          context: .
          file: tools.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless signing: cosign trades this job's OIDC token for a short-lived
      # Fulcio certificate, so there is no private key to store, rotate or leak.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # By digest, never by tag: a tag is mutable, so a signature attached to one
      # says nothing about the bytes a later puller receives. Every tag in this
      # push shares the digest, so one signature covers all of them — but only
      # within one registry, so each registry the image lands in needs its own.
      - name: Sign the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cosign sign --yes "ghcr.io/${OWNER}/gandalf-tools@${DIGEST}"
          cosign sign --yes "docker.io/${OWNER}/gandalf-tools@${DIGEST}"
