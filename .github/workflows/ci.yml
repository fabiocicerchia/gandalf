name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Lint and secret scanning live in code-quality.yml and security.yml.
# This workflow runs the tests — without it nothing here proves they pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: config.py imports tomllib, which entered the
        # stdlib in 3.11. docs/getting-started.md has always said 3.11+.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          # gandalf is stdlib-only, so pytest is the whole dev toolchain.
          # Regenerate after changing requirements-dev.in:
          #   uv pip compile requirements-dev.in --generate-hashes \
          #     --universal -p 3.11 -o requirements-dev.txt
          pip install --require-hashes -r requirements-dev.txt

      - name: Test
        run: make test

  # extensions/vscode is a separate TypeScript workspace with its own tests, and
  # publish-extension.yml packages it straight from a tag. Without this the tag
  # would be the first time any of it ran here.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install
        run: npm ci

      # `package` runs vscode:prepublish first — typecheck, then the tests —
      # so this is the whole workspace's build, and it also proves the manifest
      # still packages, which is what publish-extension.yml does on a release.
      - name: Typecheck, test and package
        run: npm run package
