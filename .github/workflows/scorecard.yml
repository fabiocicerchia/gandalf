name: scorecard

# OpenSSF Scorecard: rates the repo's security posture (branch protection,
# pinned deps, token permissions, etc.) and uploads results to the Security tab.
# Public repos: results also appear at deps.dev / the Scorecard badge.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1" # weekly
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish results (public repos)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          sarif_file: results.sarif
