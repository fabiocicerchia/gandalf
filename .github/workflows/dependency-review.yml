name: dependency-review

# Blocks PRs that introduce dependencies with known vulnerabilities or
# incompatible licenses. Requires GitHub's Dependency Graph (on by default
# for public repos; enable in Settings > Security for private repos).

on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
