name: dependency-review

# Blocks PRs that introduce dependencies with known vulnerabilities or
# incompatible licenses. Requires GitHub's Dependency Graph (on by default
# for public repos; enable in Settings > Security for private repos).

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high
          # GHSA-wj6h-64fc-37mp — Minerva timing attack on P-256 in
          # python-ecdsa. Allowed because there is nothing to upgrade to: the
          # advisory's vulnerable range is `>= 0` and it has no patched
          # version, upstream having stated it does not offer side-channel
          # resistance. checkov is the only thing that pulls it in
          # (ecdsa>=0.19.0,<1.0.0), and it is already in the published image
          # today -- pinning the tools by hash is what made it visible here,
          # not what introduced it.
          #
          # This is a suppression, not a fix. The only actual fix is dropping
          # checkov; trivy and kics in this same image also scan IaC, so that
          # is a real option rather than a theoretical one.
          #
          # The attack needs timing measurements of P-256 signing. Nothing in
          # gandalf signs with this library; it is linter dependency weight.
          # Revisit if either scanner drops it or upstream ships a fix.
          allow-ghsas: GHSA-wj6h-64fc-37mp
